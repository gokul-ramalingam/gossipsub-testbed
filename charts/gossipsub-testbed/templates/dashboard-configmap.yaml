{{- /*
Grafana dashboard. The Grafana sidecar loads each ConfigMap with the label grafana_dashboard: "1".
*/ -}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gossipsub-dashboard
  labels:
    {{- include "gossipsub-testbed.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  gossipsub.json: |-
    {{- .Files.Get "dashboards/gossipsub.json" | nindent 4 }}
{{- end }}
