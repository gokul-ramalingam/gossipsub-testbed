{{- /*
One StatefulSet per implementation (go, js). A StatefulSet gives each pod a
stable name (go-0, go-1, …) and a DNS name under the headless Service; the
pod name is the peer name, and the peer key is derived from it.
*/ -}}
{{- range $impl, $cfg := .Values.implementations }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $impl }}
  labels:
    {{- include "testbed.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $impl }}
    app.kubernetes.io/version: {{ $cfg.image.tag | quote }}
spec:
  replicas: {{ $cfg.replicas }}
  # Pod DNS names: <pod>.<serviceName>.<namespace>.svc.<clusterDomain>.
  serviceName: {{ include "testbed.serviceName" $ }}
  # Start and stop all pods at once instead of one after the other; the peers
  # do not depend on each other to start.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "testbed.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $impl }}
  template:
    metadata:
      labels:
        {{- include "testbed.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $impl }}
        app.kubernetes.io/version: {{ $cfg.image.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $cfg.runAsUser }}
        runAsGroup: {{ $cfg.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      # Spread all peers (Go and JS) evenly over the nodes, so that messages
      # cross the network between the workers. nodeTaintsPolicy Honor:
      # count only the nodes that the pod can run on. With the default
      # (Ignore), the control plane, whose taint keeps the peers out, counts
      # as a node with 0 peers, and no worker can take a second peer.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          nodeTaintsPolicy: Honor
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "testbed.selectorLabels" $ | nindent 14 }}
      containers:
        - name: peer
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          env:
            # The pod name (go-0, js-2, …) is the peer name.
            - name: PEER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISCOVERY
              value: srv
            - name: SRV_NAME
              value: {{ include "testbed.srvName" $ | quote }}
            - name: P2P_PORT
              value: {{ $.Values.ports.p2p | quote }}
            - name: HTTP_PORT
              value: {{ $.Values.ports.http | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.peer.logLevel | quote }}
            - name: REDIAL_INTERVAL
              value: {{ $.Values.peer.redialInterval | quote }}
          ports:
            - name: p2p
              containerPort: {{ $.Values.ports.p2p }}
              protocol: TCP
            - name: http
              containerPort: {{ $.Values.ports.http }}
              protocol: TCP
          # /healthz answers while the process runs. Readiness does not depend
          # on the connections: the run script checks /connections itself.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          # The peers need no rights and write no files.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
