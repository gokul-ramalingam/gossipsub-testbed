{{- /*
One StatefulSet per implementation. The stable pod name (go-0, js-1) is the peer name.
*/ -}}
{{- range $impl, $cfg := .Values.implementations }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $impl }}
  labels:
    {{- include "gossipsub-testbed.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $impl }}
    app.kubernetes.io/version: {{ $cfg.image.tag | default $.Chart.AppVersion | quote }}
spec:
  replicas: {{ $cfg.replicas }}
  serviceName: {{ include "gossipsub-testbed.serviceName" $ }}
  # Start all pods at once. The peers do not depend on each other.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "gossipsub-testbed.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $impl }}
  template:
    metadata:
      labels:
        {{- include "gossipsub-testbed.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $impl }}
        app.kubernetes.io/version: {{ $cfg.image.tag | default $.Chart.AppVersion | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $cfg.runAsUser }}
        runAsGroup: {{ $cfg.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      # Spread the peers evenly over the workers. Honor skips the tainted
      # control plane; otherwise no worker can take a second peer.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          nodeTaintsPolicy: Honor
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "gossipsub-testbed.selectorLabels" $ | nindent 14 }}
      containers:
        - name: peer
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          env:
            # The pod name is the peer name.
            - name: PEER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISCOVERY
              value: srv
            - name: SRV_NAME
              value: {{ include "gossipsub-testbed.srvName" $ | quote }}
            - name: P2P_PORT
              value: {{ $.Values.ports.p2p | quote }}
            - name: HTTP_PORT
              value: {{ $.Values.ports.http | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.peer.logLevel | quote }}
            - name: REDIAL_INTERVAL
              value: {{ $.Values.peer.redialInterval | quote }}
          ports:
            - name: p2p
              containerPort: {{ $.Values.ports.p2p }}
              protocol: TCP
            - name: http
              containerPort: {{ $.Values.ports.http }}
              protocol: TCP
          # Readiness does not depend on the connections. run.sh checks them.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
