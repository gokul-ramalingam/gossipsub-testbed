{{- /*
Scrapes /metrics of each peer. A PodMonitor, because the Service has only the p2p port.
*/ -}}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: peers
  labels:
    {{- include "gossipsub-testbed.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gossipsub-testbed.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      relabelings:
        # Add the impl label (go or js) for the dashboard.
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: impl
{{- end }}
