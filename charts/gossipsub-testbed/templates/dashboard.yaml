{{- /*
The dashboard of the testbed (dashboards/gossipsub.json), as a ConfigMap. The
dashboard sidecar of Grafana (kube-prometheus-stack) loads every ConfigMap
with the label grafana_dashboard: "1", from all namespaces. Behind
monitoring.enabled, with the PodMonitor.
*/ -}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard
  labels:
    {{- include "testbed.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  gossipsub.json: |-
    {{- .Files.Get "dashboards/gossipsub.json" | nindent 4 }}
{{- end }}
