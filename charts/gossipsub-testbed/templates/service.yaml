# Headless Service of all peers. The port name p2p gives the SRV record
# _p2p._tcp.peers.<namespace>.svc.<clusterDomain>, with one answer per pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gossipsub-testbed.serviceName" . }}
  labels:
    {{- include "gossipsub-testbed.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Put the pods in DNS before they are ready, so that the peers find each other at start.
  publishNotReadyAddresses: true
  selector:
    {{- include "gossipsub-testbed.selectorLabels" . | nindent 4 }}
  ports:
    - name: p2p
      port: {{ .Values.ports.p2p }}
      targetPort: p2p
      protocol: TCP
