# Install: helm install testbed charts/gossipsub-testbed -n dst --create-namespace

# clusterDomain is the DNS domain of the cluster.
clusterDomain: cluster.local

# ports are the libp2p (TCP) and HTTP API ports of each peer.
ports:
  p2p: 4001
  http: 8080

# peer holds the settings of every peer. KEY_SEED and TOPIC keep the peer defaults.
peer:
  # logLevel is debug, info, warn or error.
  logLevel: info
  # redialInterval is the time between two discovery rounds.
  redialInterval: 5s

# implementations has one StatefulSet per implementation. The key is the
# prefix of the pod names (go-0, js-1), and the pod name is the peer name.
implementations:
  go:
    replicas: 3
    image:
      repository: gossipsub-testbed/go-peer
      # tag defaults to the chart appVersion.
      tag: ""
      # pullPolicy is IfNotPresent: the images are loaded into kind, not pulled.
      pullPolicy: IfNotPresent
    # runAsUser and runAsGroup are user nobody of the image. runAsNonRoot needs a numeric user.
    runAsUser: 65534
    runAsGroup: 65534
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi
  js:
    replicas: 3
    image:
      repository: gossipsub-testbed/js-peer
      tag: ""
      pullPolicy: IfNotPresent
    # runAsUser and runAsGroup are user node of the image.
    runAsUser: 1000
    runAsGroup: 1000
    # resources: Node.js uses CPU in bursts. A 500m limit throttled them, so the limit is 1 CPU.
    resources:
      requests:
        cpu: 100m
        memory: 96Mi
      limits:
        cpu: 1000m
        memory: 256Mi

# monitoring adds the PodMonitor, the alert rule and the dashboard. They need
# the Prometheus Operator; set enabled to false on a cluster without it.
monitoring:
  enabled: true
  # scrapeInterval is the scrape interval of the peers. The rest of the cluster keeps 30 s.
  scrapeInterval: 5s
  # alert sets DeliveryCompletenessLow. It fires when, over 30 s, a subscriber
  # gets less than completeness of a publisher's messages and misses at least
  # minMissing.
  alert:
    completeness: 0.95
    # minMissing stops false alerts from uneven scrapes (up to 30 missing were
    # seen with no loss). 60 is 6 s at 10 msg/s; scale it with the rate.
    minMissing: 60
