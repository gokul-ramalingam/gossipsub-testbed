<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Six GossipSub peers on three kind workers, two per node. Prometheus scrapes the peers every 5 s and sends the alert through Alertmanager to a webhook receiver, a log collector on each node sends the peer logs to VictoriaLogs, and Grafana shows both. go-2 and js-2 are the peers that Scenario B isolates.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b62c9"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- host -->
  <text x="20" y="30" font-size="14" font-weight="600" fill="#17212c">Host (Docker)</text>
  <rect x="140" y="12" width="230" height="28" rx="6" fill="#ffffff" stroke="#c3cdd8" stroke-width="1.5"/>
  <text x="255" y="31" font-size="12" font-family="Menlo, monospace" fill="#17212c" text-anchor="middle">make · kubectl · helm</text>

  <!-- cluster frame -->
  <rect x="10" y="52" width="940" height="438" rx="10" fill="none" stroke="#c3cdd8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="26" y="74" font-size="12" fill="#586777">kind cluster: 1 control plane, 3 workers</text>

  <!-- control plane -->
  <rect x="26" y="86" width="150" height="196" rx="8" fill="#f4f6f9" stroke="#c3cdd8" stroke-width="1.5"/>
  <text x="40" y="106" font-size="13" font-weight="600" fill="#17212c">control plane</text>
  <rect x="40" y="118" width="122" height="28" rx="5" fill="#ffffff" stroke="#c3cdd8"/>
  <text x="101" y="136" font-size="12" fill="#17212c" text-anchor="middle">API server</text>
  <rect x="40" y="154" width="122" height="40" rx="5" fill="#ffffff" stroke="#c3cdd8"/>
  <text x="101" y="171" font-size="12" fill="#17212c" text-anchor="middle">CoreDNS</text>
  <text x="101" y="186" font-size="10.5" fill="#586777" text-anchor="middle">SRV: _p2p._tcp.peers</text>
  <text x="40" y="270" font-size="10.5" fill="#586777">no peers (taint)</text>
  <line x1="200" y1="40" x2="101" y2="116" stroke="#3b4a5a" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- workers -->
  <g>
    <rect x="196" y="86" width="240" height="196" rx="8" fill="#f4f6f9" stroke="#c3cdd8" stroke-width="1.5"/>
    <text x="210" y="106" font-size="13" font-weight="600" fill="#17212c">worker</text>
    <rect x="210" y="118" width="100" height="40" rx="6" fill="#def2f8" stroke="#0a7ea4" stroke-width="1.5"/>
    <text x="260" y="143" font-size="12.5" fill="#17212c" text-anchor="middle">go-2</text>
    <rect x="322" y="118" width="100" height="40" rx="6" fill="#fbefd9" stroke="#a76a12" stroke-width="1.5"/>
    <text x="372" y="143" font-size="12.5" fill="#17212c" text-anchor="middle">js-2</text>
    <rect x="204" y="112" width="226" height="52" rx="8" fill="none" stroke="#b23b2e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="316" y="180" font-size="10.5" fill="#b23b2e" text-anchor="middle">isolated in Scenario B</text>
    <rect x="210" y="236" width="212" height="30" rx="5" fill="#ffffff" stroke="#c3cdd8"/>
    <text x="316" y="255" font-size="11.5" fill="#17212c" text-anchor="middle">log collector</text>
  </g>
  <g>
    <rect x="452" y="86" width="240" height="196" rx="8" fill="#f4f6f9" stroke="#c3cdd8" stroke-width="1.5"/>
    <text x="466" y="106" font-size="13" font-weight="600" fill="#17212c">worker2</text>
    <rect x="466" y="118" width="100" height="40" rx="6" fill="#def2f8" stroke="#0a7ea4" stroke-width="1.5"/>
    <text x="516" y="135" font-size="12.5" fill="#17212c" text-anchor="middle">go-1</text>
    <text x="516" y="150" font-size="10" fill="#0a7ea4" text-anchor="middle">publisher</text>
    <rect x="578" y="118" width="100" height="40" rx="6" fill="#def2f8" stroke="#0a7ea4" stroke-width="1.5"/>
    <text x="628" y="143" font-size="12.5" fill="#17212c" text-anchor="middle">go-0</text>
    <rect x="466" y="236" width="212" height="30" rx="5" fill="#ffffff" stroke="#c3cdd8"/>
    <text x="572" y="255" font-size="11.5" fill="#17212c" text-anchor="middle">log collector</text>
  </g>
  <g>
    <rect x="708" y="86" width="226" height="196" rx="8" fill="#f4f6f9" stroke="#c3cdd8" stroke-width="1.5"/>
    <text x="722" y="106" font-size="13" font-weight="600" fill="#17212c">worker3</text>
    <rect x="722" y="118" width="94" height="40" rx="6" fill="#fbefd9" stroke="#a76a12" stroke-width="1.5"/>
    <text x="769" y="143" font-size="12.5" fill="#17212c" text-anchor="middle">js-0</text>
    <rect x="826" y="118" width="94" height="40" rx="6" fill="#fbefd9" stroke="#a76a12" stroke-width="1.5"/>
    <text x="873" y="143" font-size="12.5" fill="#17212c" text-anchor="middle">js-1</text>
    <rect x="722" y="236" width="198" height="30" rx="5" fill="#ffffff" stroke="#c3cdd8"/>
    <text x="821" y="255" font-size="11.5" fill="#17212c" text-anchor="middle">log collector</text>
  </g>

  <!-- pod network -->
  <line x1="216" y1="206" x2="914" y2="206" stroke="#2b62c9" stroke-width="1.8" marker-start="url(#ar-b)" marker-end="url(#ar-b)"/>
  <text x="565" y="224" font-size="11.5" fill="#2b62c9" text-anchor="middle">one GossipSub topic · libp2p TCP 4001 · peers found through the DNS SRV record</text>

  <!-- telemetry band -->
  <rect x="26" y="306" width="908" height="170" rx="8" fill="#f4f6f9" stroke="#c3cdd8" stroke-width="1.5"/>
  <text x="40" y="326" font-size="13" font-weight="600" fill="#17212c">monitoring and logging</text>

  <rect x="120" y="356" width="200" height="46" rx="6" fill="#ffffff" stroke="#c3cdd8" stroke-width="1.5"/>
  <text x="220" y="376" font-size="12.5" font-weight="600" fill="#17212c" text-anchor="middle">Prometheus</text>
  <text x="220" y="392" font-size="10.5" fill="#586777" text-anchor="middle">gs_* metrics, CPU, memory, up</text>
  <rect x="120" y="416" width="200" height="40" rx="6" fill="#ffffff" stroke="#b23b2e" stroke-width="1.5"/>
  <text x="220" y="434" font-size="12" fill="#17212c" text-anchor="middle">alert DeliveryCompletenessLow</text>
  <text x="220" y="448" font-size="10.5" fill="#586777" text-anchor="middle">Alertmanager -&gt; webhook receiver</text>
  <line x1="220" y1="402" x2="220" y2="414" stroke="#3b4a5a" stroke-width="1.3" marker-end="url(#ar)"/>

  <rect x="640" y="356" width="200" height="46" rx="6" fill="#ffffff" stroke="#c3cdd8" stroke-width="1.5"/>
  <text x="740" y="376" font-size="12.5" font-weight="600" fill="#17212c" text-anchor="middle">VictoriaLogs</text>
  <text x="740" y="392" font-size="10.5" fill="#586777" text-anchor="middle">JSON log events of the peers</text>

  <rect x="380" y="388" width="200" height="46" rx="6" fill="#ffffff" stroke="#2b62c9" stroke-width="2"/>
  <text x="480" y="408" font-size="12.5" font-weight="600" fill="#17212c" text-anchor="middle">Grafana</text>
  <text x="480" y="424" font-size="10.5" fill="#586777" text-anchor="middle">dashboard "GossipSub testbed"</text>

  <!-- flows -->
  <polyline points="196,232 168,232 168,354" fill="none" stroke="#3b4a5a" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="176" y="300" font-size="10.5" fill="#3b4a5a">/metrics of all 6 peers, every 5 s</text>
  <polyline points="572,266 572,290 760,290 760,354" fill="none" stroke="#3b4a5a" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="316" y1="266" x2="316" y2="290" stroke="#3b4a5a" stroke-width="1.3"/>
  <line x1="316" y1="290" x2="572" y2="290" stroke="#3b4a5a" stroke-width="1.3"/>
  <line x1="821" y1="266" x2="821" y2="290" stroke="#3b4a5a" stroke-width="1.3"/>
  <line x1="760" y1="290" x2="821" y2="290" stroke="#3b4a5a" stroke-width="1.3"/>
  <text x="768" y="318" font-size="10.5" fill="#3b4a5a">container logs</text>
  <line x1="320" y1="379" x2="378" y2="404" stroke="#3b4a5a" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="640" y1="379" x2="582" y2="404" stroke="#3b4a5a" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- legend -->
  <rect x="660" y="430" width="12" height="12" rx="3" fill="#def2f8" stroke="#0a7ea4" stroke-width="1.5"/>
  <text x="678" y="440" font-size="11" fill="#586777">go-libp2p</text>
  <rect x="750" y="430" width="12" height="12" rx="3" fill="#fbefd9" stroke="#a76a12" stroke-width="1.5"/>
  <text x="768" y="440" font-size="11" fill="#586777">js-libp2p</text>
  <text x="660" y="462" font-size="10.5" fill="#586777">Placement varies; always 2 peers per worker.</text>
</svg>
