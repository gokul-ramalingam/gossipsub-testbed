# promtool unit test of the alert DeliveryCompletenessLow
# (charts/gossipsub-testbed/templates/prometheusrule.yaml), with a synthetic isolation.
#
# promtool reads the rules in the Prometheus format (the spec of the PrometheusRule):
#
#   kubectl -n dst get prometheusrule gossipsub -o json | jq .spec > rules.json
#   promtool test rules delivery-completeness.test.yaml   # rules.json next to it
#
# Workload: go-1 publishes 10 msg/s for 6 min (a sample every 5 s, +50 each).
# go-0 receives all; go-2 receives nothing from 2:00 to 4:00 (isolation).

rule_files:
  - rules.json

evaluation_interval: 10s

tests:
  - interval: 5s
    input_series:
      - series: 'gs_publish_success_total{namespace="dst", run_id="t", pod="go-1"}'
        values: '0+50x72'
      - series: 'gs_messages_received_total{namespace="dst", run_id="t", pod="go-0", publisher="go-1"}'
        values: '0+50x72'
      # 0:00–2:00 receives (1200 at 2:00), 2:00–4:00 nothing, then receives again.
      - series: 'gs_messages_received_total{namespace="dst", run_id="t", pod="go-2", publisher="go-1"}'
        values: '0+50x24 1200x24 1200+50x23'

    alert_rule_test:
      # Before the isolation: nothing.
      - eval_time: 1m50s
        alertname: DeliveryCompletenessLow
        exp_alerts: []
      # 20 s into the isolation: true, but not yet for 30 s (pending, not firing).
      - eval_time: 2m20s
        alertname: DeliveryCompletenessLow
        exp_alerts: []
      # 50 s into the isolation: firing for go-2 only (go-0 receives everything).
      - eval_time: 2m50s
        alertname: DeliveryCompletenessLow
        exp_alerts:
          - exp_labels:
              severity: warning
              run_id: t
              pod: go-2
              publisher: go-1
            exp_annotations:
              summary: "go-2 misses messages of go-1 (run t)"
              description: "go-2 received less than 95 % of the messages that go-1 published in the last 30 s, for 30 s, with at least 30 missing."
      # 10 s after the recovery: the 30 s window still holds 20 s of the isolation.
      - eval_time: 4m10s
        alertname: DeliveryCompletenessLow
        exp_alerts:
          - exp_labels:
              severity: warning
              run_id: t
              pod: go-2
              publisher: go-1
            exp_annotations:
              summary: "go-2 misses messages of go-1 (run t)"
              description: "go-2 received less than 95 % of the messages that go-1 published in the last 30 s, for 30 s, with at least 30 missing."
      # 40 s after the recovery: resolved (about one window after the recovery).
      - eval_time: 4m40s
        alertname: DeliveryCompletenessLow
        exp_alerts: []
