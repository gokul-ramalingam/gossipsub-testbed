# promtool test of the alert DeliveryCompletenessLow with a simulated isolation.
# Run it with make test-alert.
#
# go-1 publishes 10 msg/s for 6 min. go-0 receives all; go-2 receives
# nothing from 2:00 to 4:00.

rule_files:
  - rules.json

evaluation_interval: 10s

tests:
  - interval: 5s
    input_series:
      - series: 'gs_publish_success_total{namespace="dst", run_id="t", pod="go-1"}'
        values: '0+50x72'
      - series: 'gs_messages_received_total{namespace="dst", run_id="t", pod="go-0", publisher="go-1"}'
        values: '0+50x72'
      # Receives until 2:00, nothing until 4:00, then receives again.
      - series: 'gs_messages_received_total{namespace="dst", run_id="t", pod="go-2", publisher="go-1"}'
        values: '0+50x24 1200x24 1200+50x23'

    alert_rule_test:
      # Before the isolation: nothing.
      - eval_time: 1m50s
        alertname: DeliveryCompletenessLow
        exp_alerts: []
      # 20 s into the isolation: pending, not firing.
      - eval_time: 2m20s
        alertname: DeliveryCompletenessLow
        exp_alerts: []
      # 50 s into the isolation: firing for go-2 only.
      - eval_time: 2m50s
        alertname: DeliveryCompletenessLow
        exp_alerts:
          - exp_labels:
              severity: warning
              run_id: t
              pod: go-2
              publisher: go-1
            exp_annotations:
              summary: "go-2 misses messages of go-1 (run t)"
              description: "go-2 received less than 95 % of the messages that go-1 published in the last 30 s, for 30 s, with at least 60 missing."
      # 10 s after the recovery: the 30 s window still holds 20 s of the isolation.
      - eval_time: 4m10s
        alertname: DeliveryCompletenessLow
        exp_alerts:
          - exp_labels:
              severity: warning
              run_id: t
              pod: go-2
              publisher: go-1
            exp_annotations:
              summary: "go-2 misses messages of go-1 (run t)"
              description: "go-2 received less than 95 % of the messages that go-1 published in the last 30 s, for 30 s, with at least 60 missing."
      # 40 s after the recovery: resolved.
      - eval_time: 4m40s
        alertname: DeliveryCompletenessLow
        exp_alerts: []
