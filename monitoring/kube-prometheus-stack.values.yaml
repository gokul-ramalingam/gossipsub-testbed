# kube-prometheus-stack 93.1.2 (release kps, namespace monitoring). Only the changes to the defaults.

# alertmanager sends DeliveryCompletenessLow, firing and resolved, to the
# in-cluster receiver (k8s/alert-receiver/). Other alerts go nowhere.
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [alertname, run_id, pod, publisher]
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 12h
      routes:
        - receiver: testbed-webhook
          matchers: ['alertname = "DeliveryCompletenessLow"']
    receivers:
      - name: "null"
      - name: testbed-webhook
        webhook_configs:
          - url: http://alert-receiver.monitoring.svc:8080/
            send_resolved: true

defaultRules:
  disabled:
    # The kind nodes share the clock of the Docker VM and run no NTP.
    NodeClockNotSynchronising: true

# On kind these listen on 127.0.0.1 only. Prometheus cannot scrape them, and
# their targets would fire alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Load monitors and rules from all releases, including the testbed chart.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d

grafana:
  # adminPassword is for the local test cluster only.
  adminPassword: admin
  # prune removes data sources that are no longer provisioned.
  prune: true
  # plugins: Grafana downloads the VictoriaLogs plugin at start, so the cluster needs internet access.
  plugins:
    - victoriametrics-logs-datasource@0.33.1
  # The peer logs. The dashboard refers to the fixed uid.
  additionalDataSources:
    - name: VictoriaLogs
      uid: victorialogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://vls-victoria-logs-single-server.logging.svc:9428
      editable: false
