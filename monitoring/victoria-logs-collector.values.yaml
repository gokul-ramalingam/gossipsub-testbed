# Values of victoria-logs-collector 0.3.8 (vlagent v1.53.0) for the testbed
# (release "vlc", namespace "logging"). A DaemonSet: one collector per node
# reads the container log files of the node and sends the lines to VictoriaLogs.
# Only what differs from the defaults.
#
# The defaults of collector.* fit the peers' JSON lines: the time comes from
# the field ts (with microseconds), and every other field (event, peer, run_id,
# seq, …) becomes a field in VictoriaLogs. The peers write no message field
# (msg); event stays a field, so that the queries read event:received.

remoteWrite:
  # The VictoriaLogs server of victoria-logs-single.values.yaml.
  - url: http://vls-victoria-logs-single-server.logging.svc:9428

collector:
  # The pod labels repeat on every line (10 fields per line); the peers' own
  # fields peer and impl already say which peer wrote it.
  includePodLabels: false

extraArgs:
  # _msg of a line without a message field (the peers' lines): a short dash
  # instead of the default text with a link. The collector sets _msg before
  # the server sees the line, so the flag is set here.
  defaultMsgValue: "-"
