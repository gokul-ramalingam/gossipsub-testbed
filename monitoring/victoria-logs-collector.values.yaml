# victoria-logs-collector 0.3.8 (release vlc, namespace logging). Only the changes to the defaults.
# One collector per node sends the container logs to VictoriaLogs. Each JSON
# field of a peer line becomes a field, and the time comes from ts.

remoteWrite:
  - url: http://vls-victoria-logs-single-server.logging.svc:9428

collector:
  # The fields peer and impl already name the peer, so the pod labels are not needed.
  includePodLabels: false

extraArgs:
  # _msg of a line without a message field: a dash, not the default long text.
  defaultMsgValue: "-"
