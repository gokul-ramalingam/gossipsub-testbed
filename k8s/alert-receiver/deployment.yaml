apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  labels:
    app.kubernetes.io/name: alert-receiver
    app.kubernetes.io/component: alert-receiver
    app.kubernetes.io/part-of: gossipsub-testbed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
        app.kubernetes.io/component: alert-receiver
        app.kubernetes.io/part-of: gossipsub-testbed
    spec:
      # The receiver does not use the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: python:3.13.18-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          imagePullPolicy: IfNotPresent
          # -B: write no .pyc files (the file system is read-only).
          command: ["python", "-B", "/app/receiver.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: alert-receiver
