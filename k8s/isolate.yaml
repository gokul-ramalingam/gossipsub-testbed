# Isolates go-2 and js-2 from the other peers (Scenario B). scripts/isolate.sh
# applies it and also cuts the open connections: a policy blocks only new ones.
# Allowed: go-2 <-> js-2, Prometheus scrapes, and DNS. Probes and logs are not
# affected, because they do not go through the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate
  namespace: dst
  labels:
    app.kubernetes.io/part-of: gossipsub-testbed
spec:
  # The isolated peers, by the pod name label of the StatefulSet.
  podSelector:
    matchExpressions:
      - key: statefulset.kubernetes.io/pod-name
        operator: In
        values: [go-2, js-2]
  policyTypes: [Ingress, Egress]
  ingress:
    # From each other.
    - from:
        - podSelector:
            matchExpressions:
              - key: statefulset.kubernetes.io/pod-name
                operator: In
                values: [go-2, js-2]
    # From Prometheus, to /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # To each other.
    - to:
        - podSelector:
            matchExpressions:
              - key: statefulset.kubernetes.io/pod-name
                operator: In
                values: [go-2, js-2]
    # To CoreDNS, for the SRV lookup.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
