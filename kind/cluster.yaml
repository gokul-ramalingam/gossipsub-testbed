# kind cluster of the gossipsub testbed: 1 control plane and 3 workers.
#
# Create:  kind create cluster --config kind/cluster.yaml
# Delete:  kind delete cluster --name gossipsub-testbed
#
# The node image is pinned by tag and digest, from the release notes of
# kind v0.33.0. Kubernetes v1.36 matches kubectl v1.36 (kubectl supports a
# server one minor version away at most). The peers run on the three workers,
# 2 per worker, so that 12 of the 15 peer pairs are on different nodes; the
# control plane has a NoSchedule taint, so no peer is scheduled on it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gossipsub-testbed
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
